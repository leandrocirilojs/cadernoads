<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  



  
  <title>Agenda — Anotações da Faculdade</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>Agenda</h1>
      <p id="todayLabel"></p>
    </div>

    <!-- CALENDÁRIO -->
    <div>
      <div class="sidebar-section-label">Calendário</div>
      <div class="calendar-container">
        <div class="calendar-header">
          <button id="prevMonthBtn">&lt;</button>
          <span id="calendarMonthLabel">Mês Ano</span>
          <button id="nextMonthBtn">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>

    <!-- INSERIR -->
    <div>
      <div class="sidebar-section-label">Inserir</div>
      <div class="insert-menu">
        <button class="btn-insert-item" id="addPostitBtn">📌 Post-it</button>
        <button class="btn-insert-item" id="addQuickNoteBtn">📝 Anotação</button>
        <button class="btn-insert-item" id="addTableBtn">📊 Tabela</button>
        <button class="btn-insert-item" id="addQuickTaskBtn">☑️ Tarefa</button>
      </div>
    </div>

    <!-- MATÉRIAS -->
    <div>
      <div class="sidebar-section-label">Matérias</div>
      <ul class="subject-list" id="subjectList"></ul>
      <button class="btn-add-subject" id="addSubjectBtn">+ Nova matéria</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title">
        <h2 id="currentSubjectName">Selecione uma matéria</h2>
        <p id="currentSubjectMeta">0 itens</p>
      </div>
      <div class="view-tabs">
        <button class="view-tab active" data-view="notes">Anotações</button>
        <button class="view-tab" data-view="tasks">Tarefas</button>
        <button class="view-tab" data-view="schedule">Horário</button>
      </div>
    </div>

    <div class="content">
      <div class="note-sheet" id="noteSheet"></div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
